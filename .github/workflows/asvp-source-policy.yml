name: ASVP opt-in illustration checks

on:
  pull_request:
    paths:
      - 'studio/app.py'
      - 'studio/pipeline/**'
      - 'studio/tests/test_illustrations.py'
      - '.github/workflows/asvp-source-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python source syntax
        run: python -m compileall -q studio/app.py studio/pipeline studio/tests/test_illustrations.py
      - name: Install minimal test dependencies
        run: python -m pip install "Pillow>=11,<13" "imageio-ffmpeg>=0.6,<0.7"
      - name: Source policy regression tests
        env:
          PYTHONPATH: studio
        run: python -m unittest discover -s studio/tests -p 'test_illustrations.py' -v
